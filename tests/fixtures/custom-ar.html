<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><script src="_harness.js"></script><title>شريط غير معروف (عربي)</title></head><body><h1>شريط موافقة مخصص</h1>
<div id="x7" style="position:fixed;top:0;left:0;right:0;background:#fff;padding:18px;z-index:5000;box-shadow:0 2px 12px #0003">
  <p>نستخدم ملفات تعريف الارتباط وتقنيات مماثلة لتحسين تجربتك ولأغراض الإعلانات مع شركائنا. <a href="/privacy">سياسة الخصوصية</a></p>
  <span role="button" tabindex="0" class="b1">قبول الكل</span>
  <span role="button" tabindex="0" class="b2">رفض الكل</span>
</div>
<script>
ohoLock();
const x = document.getElementById('x7');
x.querySelector('.b1').onclick = () => ohoClose(x, 'accepted');
x.querySelector('.b2').onclick = () => ohoClose(x, 'rejected');
</script></body></html>
