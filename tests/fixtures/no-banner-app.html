<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><script src="_harness.js"></script><title>Web app (no banner)</title>
<style>
#toolbar{position:fixed;top:0;left:0;right:0;height:48px;background:#222;color:#fff;z-index:1000;display:flex;align-items:center;gap:8px;padding:0 12px}
#side{position:fixed;top:48px;left:0;bottom:0;width:200px;background:#f4f4f4;z-index:900}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 16px;z-index:5000;border-radius:6px}
#login{position:fixed;inset:0;background:#0007;z-index:10000;display:flex;align-items:center;justify-content:center}
#login form{background:#fff;padding:24px;width:340px}
body{padding-left:220px;padding-top:60px}
</style></head><body>
<!-- False-positive traps: app chrome, a toast with "OK", an invite with "Accept"/"Decline" and a login modal. -->
<div id="toolbar"><b>Acme</b> <button>New</button> <button>Share</button> <span>Invite from Sam:</span> <button id="acc">Accept</button> <button id="dec">Decline</button></div>
<aside id="side"><a href="/inbox">Inbox</a><br><a href="/settings">Settings</a><br><a href="/privacy">Privacy settings</a></aside>
<div id="toast">Your changes were saved. <button id="ok">OK</button></div>
<div id="login" role="dialog" aria-modal="true"><form onsubmit="return false">
  <h2>Sign in to continue</h2>
  <p>By continuing you agree to our Terms and Privacy Policy, including the use of cookies.</p>
  <input type="email" placeholder="Email"><br><input type="password" placeholder="Password"><br>
  <button type="submit">Sign in</button> <button type="button">Cancel</button>
</form></div>
<h1>Dashboard</h1>
</body></html>
